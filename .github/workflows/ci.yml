name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"
      - name: Test
        # `pytest`, not `python -m pytest`: the latter puts the repo root on
        # sys.path, where the source `cgeo/` package shadows the installed one
        # and has no compiled `_cgeo`.
        run: pytest tests -q

  cmake:
    name: CMake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "pybind11>=2.13,<4"
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE=$(which python)
      - name: Build
        run: cmake --build build --config Release -j
